<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="v1-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="drift-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="delta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow filters with bounding box relative coordinate space -->
    <filter id="cyan-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="drift-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="core-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Drift displacement field vectors (ghost to drifted position) -->
  <g opacity="0.4" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3">
    <line x1="156" y1="64" x2="182" y2="48"/>
    <line x1="192" y1="128" x2="218" y2="112"/>
    <line x1="156" y1="192" x2="182" y2="176"/>
  </g>

  <!-- Ghost / Original Right Bracket footprint (Pre-drift baseline v1) -->
  <path d="M 156 64 L 192 128 L 156 192"
        stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="4 6" opacity="0.6"/>

  <!-- Classification Spectrum Channels (Compatible, Warning, Breaking) -->
  <!-- Upper Channel: Compatible (Emerald #10b981) -->
  <g>
    <line x1="98" y1="94" x2="152" y2="94" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.9"/>
    <circle cx="158" cy="94" r="3.5" fill="#10b981"/>
  </g>

  <!-- Mid Channel: Warning (Solar Amber #f59e0b) -->
  <g>
    <line x1="84" y1="128" x2="182" y2="128" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.9"/>
    <polygon points="187,128 181,124 181,132" fill="#f59e0b"/>
  </g>

  <!-- Lower Channel: Breaking (Crimson #f43f5e) & Auto-fix suggestion (Azure #38bdf8) -->
  <g>
    <line x1="98" y1="162" x2="142" y2="162" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <polygon points="146,162 139,158 139,166" fill="#f43f5e"/>
    <!-- Suggestion patch arrow bridging the break -->
    <line x1="154" y1="162" x2="180" y2="162" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <polygon points="186,162 178,157.5 178,166.5" fill="#38bdf8"/>
  </g>

  <!-- Left Bracket (v1 Stable Contract Baseline) -->
  <g filter="url(#cyan-glow)">
    <path d="M 102 64 L 66 128 L 102 192"
          stroke="url(#v1-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Precision vertex node -->
    <circle cx="66" cy="128" r="4" fill="#ffffff"/>
  </g>

  <!-- Drifted Right Bracket (v2 Mutated / Drifted Surface) -->
  <g filter="url(#drift-glow)">
    <path d="M 182 48 L 218 112 L 182 176"
          stroke="url(#drift-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Mutated vertex node -->
    <circle cx="218" cy="112" r="4" fill="#fffbeb"/>
  </g>

  <!-- Central Delta Symbol (Differential Core) -->
  <g filter="url(#core-glow)">
    <polygon points="128,100 144,128 112,128"
             fill="#0f172a" fill-opacity="0.6"
             stroke="url(#delta-grad)" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="128" cy="119" r="2.5" fill="#38bdf8"/>
  </g>
</svg>
