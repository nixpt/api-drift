<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 220" width="860" height="220" fill="none">
  <defs>
    <!-- Logo Background Gradient -->
    <linearGradient id="logo-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#05070e" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="logo-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f0ff"/>
    </linearGradient>

    <!-- Gradients for the emblem -->
    <linearGradient id="logo-v1-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="logo-drift-grad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <linearGradient id="logo-delta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="logo-cyan-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="logo-drift-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="logo-core-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box with Rounded Edges -->
  <rect x="2" y="2" width="856" height="216" rx="24" fill="url(#logo-bg-grad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Left: Emblem Container -->
  <g transform="translate(36, 28) scale(0.64)">
    <!-- Drift displacement field vectors -->
    <g opacity="0.4" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 3">
      <line x1="156" y1="64" x2="182" y2="48"/>
      <line x1="192" y1="128" x2="218" y2="112"/>
      <line x1="156" y1="192" x2="182" y2="176"/>
    </g>

    <!-- Ghost / Original Right Bracket footprint -->
    <path d="M 156 64 L 192 128 L 156 192"
          stroke="#475569" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"
          stroke-dasharray="4 6" opacity="0.6"/>

    <!-- Classification Spectrum Channels -->
    <g>
      <line x1="98" y1="94" x2="152" y2="94" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 3" opacity="0.9"/>
      <circle cx="158" cy="94" r="3.5" fill="#10b981"/>
    </g>
    <g>
      <line x1="84" y1="128" x2="182" y2="128" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="4 4" opacity="0.9"/>
      <polygon points="187,128 181,124 181,132" fill="#f59e0b"/>
    </g>
    <g>
      <line x1="98" y1="162" x2="142" y2="162" stroke="#f43f5e" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
      <polygon points="146,162 139,158 139,166" fill="#f43f5e"/>
      <line x1="154" y1="162" x2="180" y2="162" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      <polygon points="186,162 178,157.5 178,166.5" fill="#38bdf8"/>
    </g>

    <!-- Left Bracket -->
    <g filter="url(#logo-cyan-glow)">
      <path d="M 102 64 L 66 128 L 102 192"
            stroke="url(#logo-v1-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="66" cy="128" r="4" fill="#ffffff"/>
    </g>

    <!-- Drifted Right Bracket -->
    <g filter="url(#logo-drift-glow)">
      <path d="M 182 48 L 218 112 L 182 176"
            stroke="url(#logo-drift-grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="218" cy="112" r="4" fill="#fffbeb"/>
    </g>

    <!-- Central Delta Symbol -->
    <g filter="url(#logo-core-glow)">
      <polygon points="128,100 144,128 112,128"
               fill="#0f172a" fill-opacity="0.8"
               stroke="url(#logo-delta-grad)" stroke-width="4" stroke-linejoin="round"/>
      <circle cx="128" cy="119" r="2.5" fill="#38bdf8"/>
    </g>
  </g>

  <!-- Vertical Divider -->
  <line x1="220" y1="36" x2="220" y2="184" stroke="#1e293b" stroke-width="2"/>

  <!-- Right: Typography & Meta -->
  <!-- Wordmark Line -->
  <g transform="translate(248, 42)">
    <text x="0" y="38" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="44" fill="#f8fafc" letter-spacing="-1">api<tspan fill="url(#logo-title-grad)">-drift</tspan></text>

    <!-- Badges -->
    <!-- Version Pill -->
    <g transform="translate(228, 10)">
      <rect x="0" y="0" width="64" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="32" y="19" text-anchor="middle" font-family="'JetBrainsMono NF', monospace" font-size="13" font-weight="700" fill="#38bdf8">v0.1.0</text>
    </g>

    <!-- Rust Badge -->
    <g transform="translate(300, 10)">
      <rect x="0" y="0" width="58" height="28" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
      <text x="29" y="19" text-anchor="middle" font-family="'JetBrainsMono NF', monospace" font-size="12" font-weight="700" fill="#cbd5e1">RUST</text>
    </g>

    <!-- Zero-Dep Pill -->
    <g transform="translate(366, 10)">
      <rect x="0" y="0" width="134" height="28" rx="6" fill="#064e3b" fill-opacity="0.4" stroke="#059669" stroke-width="1.2"/>
      <text x="67" y="19" text-anchor="middle" font-family="'JetBrainsMono NF', monospace" font-size="12" font-weight="700" fill="#34d399">ZERO-DEP CORE</text>
    </g>
  </g>

  <!-- Tagline -->
  <g transform="translate(248, 118)">
    <text x="0" y="0" font-family="'Inter', sans-serif" font-weight="500" font-size="15.5" fill="#cbd5e1">
      Contract drift detection, break classification &amp; mechanical patch suggestions
    </text>
  </g>

  <!-- Feature / Severity Pipeline Bar -->
  <g transform="translate(248, 154)">
    <!-- Pipeline step items -->
    <g font-family="'JetBrainsMono NF', monospace" font-size="12.5" font-weight="600">
      <text x="0" y="0" fill="#38bdf8">snapshot</text>
      <text x="68" y="0" fill="#64748b">──▶</text>
      <text x="96" y="0" fill="#38bdf8">diff</text>
      <text x="134" y="0" fill="#64748b">──▶</text>
      <text x="162" y="0" fill="#f59e0b">classify</text>
      <text x="230" y="0" fill="#64748b">──▶</text>
      <text x="258" y="0" fill="#10b981">suggest</text>
    </g>

    <!-- Severity indicators on right -->
    <g transform="translate(332, 0)" font-family="'Inter', sans-serif" font-size="12" font-weight="600">
      <circle cx="6" cy="-4" r="4" fill="#10b981"/>
      <text x="16" y="0" fill="#94a3b8">Compatible</text>

      <polygon points="98,-8 103,0 93,0" fill="#f59e0b"/>
      <text x="110" y="0" fill="#94a3b8">Warning</text>

      <rect x="172" y="-8" width="8" height="8" rx="1.5" fill="#f43f5e"/>
      <text x="186" y="0" fill="#94a3b8">Breaking</text>
    </g>
  </g>
</svg>
