[workspace]
resolver = "2"
members = ["crates/api-drift", "crates/api-drift-ledger"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nixpt/api-drift"
keywords = ["api", "semver", "breaking-changes", "rustdoc", "codemod"]
categories = ["development-tools"]
# `[lints]` needs cargo 1.74; serde_json declares 1.71; `is_some_and` needs 1.70.
rust-version = "1.74"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[workspace.dependencies]
api-drift = { path = "crates/api-drift" }
api-drift-ledger = { path = "crates/api-drift-ledger" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"

