[package]
name = "api-drift-ledger"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedded contract ledger for api-drift: Surface surfaces, the ledger! test macro, ledger.jsonl"

[features]
# Consumer-side check: api-drift.toml pins + syn usage scan + check! macro.
consumer = ["dep:syn", "dep:proc-macro2", "dep:toml"]

[dependencies]
api-drift = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
# consumer feature: api-drift.toml parsing + syn walk of consumer source
syn = { version = "2", features = ["full", "visit"], optional = true }
proc-macro2 = { version = "1", features = ["span-locations"], optional = true }
toml = { version = "0.8", optional = true }

[dev-dependencies]
api-drift = { workspace = true }

[lints]
workspace = true
