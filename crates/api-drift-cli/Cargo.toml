[package]
name = "api-drift-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "api-drift CLI: check / note against a repo's embedded ledger (affected/release-hint arrive with the consumer layer)"

[[bin]]
name = "api-drift"
path = "src/main.rs"

[dependencies]
api-drift = { workspace = true, features = ["serde"] }
api-drift-ledger = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
